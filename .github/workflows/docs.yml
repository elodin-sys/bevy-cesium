name: API docs

on:
  push:
    branches: [main]
    paths:
      - "crates/bevy-tiles/**"
      - "crates/cesium-native-bridge/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: docs-linux-1.98-${{ hashFiles('Cargo.lock') }}
          restore-keys: docs-linux-1.98-
      - name: Build rustdoc
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
          DOCS_RS: "1"
        run: cargo doc --workspace --no-deps --locked
      - name: Landing page
        run: printf '%s\n' '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=bevy_cesium/"><link rel="canonical" href="bevy_cesium/"><title>Bevy-Cesium</title><p><a href="bevy_cesium/">Bevy-Cesium API</a></p>' > target/doc/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
