[package]
name="tiles-core"
version="0.2.0"
edition="2024"
license="MIT OR Apache-2.0"
publish=false
[dependencies]
glam="0.32"
serde={version="1",features=["derive"]}
serde_json="1"
gltf={version="1.4.1",default-features=false,features=["utils","names","extensions"]}
image={version="0.25",default-features=false,features=["jpeg","png"]}
draco-core="=2.3.1"
url="2"
base64="0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq={version="3",default-features=false,features=["rustls", "gzip"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "RequestMode", "RequestRedirect", "Response", "Headers", "AbortController", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader"] }
