[package]
name = "bevy-tiles"
publish = false
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared Bevy scene contract for 3D Tiles backends"
repository = "https://github.com/elodin-sys/bevy-cesium"
documentation = "https://elodin-sys.github.io/bevy-cesium/bevy_tiles/"

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_color", "bevy_camera", "bevy_image", "bevy_mesh", "bevy_render", "bevy_pbr", "bevy_log"] }
